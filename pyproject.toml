[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "integration-recovery-agent"
version = "0.1.0"
description = "Integration Recovery Agent with Agno, Neon, and AgentOS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agno[os]",
    "psycopg[binary]",
    "psycopg-pool",
    "python-multipart",
    "pydantic",
    "pydantic-settings",
    "uvicorn",
    "python-dotenv",
    "semantica",
    "rdflib",
    "networkx",
    "fastembed",
    "numpy",
    "scipy",
    "pandas"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py310"
