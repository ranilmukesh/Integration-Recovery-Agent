[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "integration-recovery-agent"
version = "0.1.0"
description = "Integration Recovery Agent with Agno, Neon, and AgentOS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agno[os]==2.7.2",
    "psycopg[binary]>=3.3.4",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py310"
